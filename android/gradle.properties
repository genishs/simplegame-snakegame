org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Android shell revision for the current GAME_VERSION (issue #26).
# versionCode = (major*10000 + minor*100 + patch) * 100 + androidRev
# Bump for a shell-only re-upload of the same game version; reset to 1 when
# GAME_VERSION in game.js changes. Range 1..99. `-PandroidRev=N` overrides.
androidRev=1
